name: Publish npm

on:
  workflow_dispatch:
    inputs:
      target:
        description: "npm package target to publish"
        required: true
        type: choice
        default: all-in-one
        options:
          - linuxX64
          - mingwX64
          - macosArm64
          - main
          - all-platforms
          - all-in-one

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      linux_exists: ${{ steps.packages.outputs.linux_exists }}
      mingw_exists: ${{ steps.packages.outputs.mingw_exists }}
      macos_exists: ${{ steps.packages.outputs.macos_exists }}
      main_exists: ${{ steps.packages.outputs.main_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Read project version
        id: version
        run: |
          version="$(sed -nE 's/^projectVersion[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties | head -n1)"

          if [[ -z "$version" || "$version" == "unspecified" ]]; then
            echo "Invalid project version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Project version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Check npm packages
        id: packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          check_package() {
            local output_name="$1"
            local package_name="$2"

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
              echo "| \`${package_name}@${VERSION}\` | exists, skip publish |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
              echo "| \`${package_name}@${VERSION}\` | missing, publish if selected |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          {
            echo ""
            echo "| Package | Status |"
            echo "|---------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          check_package "linux_exists" "@czp3009/openai-stream-proxy-linux_x64"
          check_package "mingw_exists" "@czp3009/openai-stream-proxy-mingw_x64"
          check_package "macos_exists" "@czp3009/openai-stream-proxy-macos_arm64"
          check_package "main_exists" "@czp3009/openai-stream-proxy"

  linux-x64:
    needs: check
    if: ${{ (inputs.target == 'linuxX64' || inputs.target == 'all-platforms' || inputs.target == 'all-in-one') && needs.check.outputs.linux_exists == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Gradle/JVM and Kotlin/Native
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish to npm." >&2
            exit 1
          fi

          printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc

      - name: Publish linuxX64 npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./gradlew :cli:publishKotlinNativeNpmLinuxX64Package

  windows-x64:
    needs: check
    if: ${{ (inputs.target == 'mingwX64' || inputs.target == 'all-platforms' || inputs.target == 'all-in-one') && needs.check.outputs.mingw_exists == 'false' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Gradle/JVM and Kotlin/Native
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NODE_AUTH_TOKEN)) {
            Write-Error "NPM_TOKEN secret is required to publish to npm."
            exit 1
          }

          "//registry.npmjs.org/:_authToken=$env:NODE_AUTH_TOKEN" | Out-File -FilePath "$env:USERPROFILE\.npmrc" -Encoding ascii

      - name: Publish mingwX64 npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: .\gradlew.bat :cli:publishKotlinNativeNpmMingwX64Package

  macos-arm64:
    needs: check
    if: ${{ (inputs.target == 'macosArm64' || inputs.target == 'all-platforms' || inputs.target == 'all-in-one') && needs.check.outputs.macos_exists == 'false' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Gradle/JVM and Kotlin/Native
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish to npm." >&2
            exit 1
          fi

          printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc

      - name: Publish macosArm64 npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./gradlew :cli:publishKotlinNativeNpmMacosArm64Package

  main:
    needs: check
    if: ${{ (inputs.target == 'main' || inputs.target == 'all-in-one') && needs.check.outputs.main_exists == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify platform packages exist
        if: ${{ inputs.target == 'main' }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
          LINUX_EXISTS: ${{ needs.check.outputs.linux_exists }}
          MINGW_EXISTS: ${{ needs.check.outputs.mingw_exists }}
          MACOS_EXISTS: ${{ needs.check.outputs.macos_exists }}
        run: |
          missing=()

          if [[ "$LINUX_EXISTS" != "true" ]]; then
            missing+=("@czp3009/openai-stream-proxy-linux_x64@${VERSION}")
          fi
          if [[ "$MACOS_EXISTS" != "true" ]]; then
            missing+=("@czp3009/openai-stream-proxy-macos_arm64@${VERSION}")
          fi
          if [[ "$MINGW_EXISTS" != "true" ]]; then
            missing+=("@czp3009/openai-stream-proxy-mingw_x64@${VERSION}")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing platform package: %s\n' "${missing[@]}" >&2
            echo "Publish missing platform packages before publishing the main package." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Gradle/JVM
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-main-npm-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-main-npm-

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN secret is required to publish to npm." >&2
            exit 1
          fi

          printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > ~/.npmrc

      - name: Publish main npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./gradlew :cli:publishKotlinNativeNpmMainPackage
